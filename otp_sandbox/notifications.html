<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Dashboard</title>
    <style>
        :root {
            --primary: #10b981;
            --bg: #f3f4f6;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #111;
        }

        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f9fafb;
            text-align: left;
            padding: 0.75rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: #6b7280;
        }

        .refresh-btn {
            background: white;
            border: 1px solid #d1d5db;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #f9fafb;
        }

        .timestamp {
            color: #6b7280;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Active Subscriptions</h1>
            <button onclick="fetchNotifications()" class="refresh-btn">Refresh Data</button>
        </div>

        <div class="card">
            <table id="notifGroup">
                <thead>
                    <tr>
                        <th>Phone Number</th>
                        <th>Status</th>
                        <th>Subscription ID</th>
                        <th>Received At</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data goes here -->
                </tbody>
            </table>
            <div id="emptyMsg" class="empty-state">Waiting for notifications...</div>
        </div>
    </div>

    <script>
        async function fetchNotifications() {
            try {
                const res = await fetch('/notifications');
                const data = await res.json();

                const tbody = document.getElementById('tableBody');
                const empty = document.getElementById('emptyMsg');

                tbody.innerHTML = '';

                if (data.length === 0) {
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    data.forEach(item => {
                        const tr = document.createElement('tr');

                        // Determine Status Color
                        const statusClass = (item.status === 'active' || item.status === 'REGISTERED') ? 'status-active' : 'status-inactive';

                        tr.innerHTML = `
                        <td style="font-weight: 500;">${item.msisdn || item.subscriberId || 'N/A'}</td>
                        <td><span class="status-badge ${statusClass}">${(item.status || 'Unknown').toUpperCase()}</span></td>
                        <td style="font-family: monospace;">${item.subscription_id || item.requestId || '-'}</td>
                        <td class="timestamp">${new Date(item.receivedAt).toLocaleString()}</td>
                    `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Poll every 5 seconds
        fetchNotifications();
        setInterval(fetchNotifications, 5000);
    </script>

</body>

</html>
