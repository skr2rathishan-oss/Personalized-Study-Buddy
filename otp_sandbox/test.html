<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Tester</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background: #f0f2f5;
        }

        .card {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .log {
            margin-top: 1rem;
            padding: 10px;
            background: #333;
            color: lime;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
            display: none;
            white-space: pre-wrap;
        }

        h2 {
            text-align: center;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🧪 OTP Tester</h2>

        <label>Credentials</label>
        <input type="text" id="app_id" placeholder="App ID" value="app_12345">
        <input type="password" id="password" placeholder="Password">

        <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">

        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="947xxxxxxxx">
        <button onclick="sendOtp()">Send OTP</button>

        <div id="verifySection"
            style="margin-top: 20px; display: none; border-top: 1px dashed #ccc; padding-top: 20px;">
            <label>Enter OTP</label>
            <input type="text" id="otp" placeholder="123456">
            <input type="hidden" id="ref_no">
            <button onclick="verifyOtp()" style="background: #28a745;">Verify</button>
        </div>

        <div id="log" class="log"></div>
    </div>

    <script>
        function log(msg, isError = false) {
            const el = document.getElementById('log');
            el.style.display = 'block';
            el.innerText = typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg;
            el.style.color = isError ? '#ff6b6b' : 'lime';
        }

        async function sendOtp() {
            const appId = document.getElementById('app_id').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_id: appId, password: password, phone: phone })
                });
                const data = await res.json();
                log(data);

                if (data.statusCode === 'S1000') {
                    document.getElementById('ref_no').value = data.referenceNo;
                    document.getElementById('verifySection').style.display = 'block';
                }
            } catch (e) { log(e.message, true); }
        }

        async function verifyOtp() {
            const appId = document.getElementById('app_id').value;
            const password = document.getElementById('password').value;
            const refNo = document.getElementById('ref_no').value;
            const otp = document.getElementById('otp').value;

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_id: appId, password: password, ref_no: refNo, otp: otp })
                });
                const data = await res.json();
                log(data);

                if (data.statusCode === 'S1000' || data.status === 'Success') {
                    alert("Verified Successfully! Redirecting to App...");
                    window.location.href = "/app.html";
                }
            } catch (e) { log(e.message, true); }
        }
    </script>

</body>

</html>
