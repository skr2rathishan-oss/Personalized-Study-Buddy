<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Tester</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        .hidden {
            display: none;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>📱 OTP Sandbox</h2>

        <!-- Step 1: Phone Input -->
        <div id="step1">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="9471XXXXXXX" value="947">
            </div>
            <button onclick="requestOTP()">Send OTP</button>
        </div>

        <!-- Step 2: OTP Input -->
        <div id="step2" class="hidden">
            <div class="form-group">
                <label for="otp">Enter OTP Code</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6">
            </div>
            <button onclick="verifyOTP()">Verify Code</button>
            <p style="text-align: center; margin-top: 10px;"><a href="#" onclick="reset()"
                    style="font-size: 0.8rem; color: #666;">Change Number</a></p>
        </div>

        <!-- Status Message -->
        <div id="status"></div>
    </div>

    <script>
        let currentReferenceNo = null;

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.innerHTML = msg;
            el.className = type;
            el.style.display = 'block';
        }

        async function requestOTP() {
            const phoneInput = document.getElementById('phone').value.trim();
            // Ensure format tel:94...
            let formattedPhone = phoneInput;
            if (!formattedPhone.startsWith('tel:')) {
                // Remove existing tel: if typed? No, assume user types number
                formattedPhone = `tel:${formattedPhone.replace(/^tel:/, '')}`;

            }

            showStatus('Sending OTP...', 'pending');

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subscriberId: formattedPhone })
                });
                const data = await res.json();

                if (data.statusCode === "S1000") {
                    showStatus('OTP Sent! Check your phone.', 'success');
                    currentReferenceNo = data.referenceNo;
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else {
                    showStatus(`Error: ${data.statusDetail || 'Unknown Error'}`, 'error');
                }
            } catch (err) {
                showStatus('Network Error', 'error');
                console.error(err);
            }
        }

        async function verifyOTP() {
            const otpCode = document.getElementById('otp').value.trim();
            if (!otpCode) return;

            showStatus('Verifying...', 'pending');

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ referenceNo: currentReferenceNo, otp: otpCode })
                });
                const data = await res.json();

                if (data.statusCode === "S1000") {
                    showStatus('✅ Verified Successfully!', 'success');
                } else {
                    showStatus(`Verification Failed: ${data.statusDetail}`, 'error');
                }
            } catch (err) {
                showStatus('Verification Error', 'error');
            }
        }

        function reset() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('status').style.display = 'none';
            document.getElementById('otp').value = '';
        }
    </script>

</body>

</html>
